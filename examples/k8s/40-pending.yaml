# KD-K8S-004: pide más CPU que cualquier nodo de kind y además un PVC inexistente.
apiVersion: v1
kind: Pod
metadata:
  name: pending
  namespace: kdoctor-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "500"
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: missing-claim

# VD-K8S-009: IRSA mal cableado. kind no tiene el webhook de EKS, así que los Pods nunca reciben las variables de IRSA
# (justo el síntoma de un webhook caído o de Pods creados antes de anotar el ServiceAccount).
# - irsa-ok: ServiceAccount con un ARN válido, pero sus Pods no recibieron AWS_ROLE_ARN ni AWS_WEB_IDENTITY_TOKEN_FILE.
# - irsa-mal: ServiceAccount con un ARN mal formado.
# - irsa-viejo: un Pod con un AWS_ROLE_ARN de otro rol distinto al de la anotación actual.
# El ARN usa la cuenta de ejemplo 123456789012.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: irsa-ok
  namespace: venom-demo
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/demo-app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: irsa-mal
  namespace: venom-demo
  annotations:
    eks.amazonaws.com/role-arn: demo-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: irsa-web
  namespace: venom-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: irsa-web}
  template:
    metadata:
      labels: {app: irsa-web}
    spec:
      serviceAccountName: irsa-ok
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: irsa-viejo
  namespace: venom-demo
spec:
  serviceAccountName: irsa-ok
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
        - {name: AWS_ROLE_ARN, value: "arn:aws:iam::123456789012:role/rol-anterior"}
        - {name: AWS_WEB_IDENTITY_TOKEN_FILE, value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token}

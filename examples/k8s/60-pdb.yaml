# KD-K8S-007: cuatro PodDisruptionBudgets que estorban a un drain, cada uno por una causa distinta.
# - pdb-single: una sola réplica sana con minAvailable: 1 -> no se puede desalojar nunca.
# - pdb-degraded: 2 réplicas con minAvailable: 2 y readiness que nunca pasa -> faltan Pods sanos.
# - pdb-greedy: minAvailable: 3 sobre un workload de 1 réplica -> pide más Pods de los que existen.
# - pdb-orphan: el selector no coincide con ningún Pod.
apiVersion: apps/v1
kind: Deployment
metadata: {name: single, namespace: kdoctor-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: single}}
  template:
    metadata: {labels: {app: single}}
    spec:
      containers: [{name: app, image: "busybox:1.36", command: ["sleep", "3600"]}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: pdb-single, namespace: kdoctor-demo}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: single}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: degraded, namespace: kdoctor-demo}
spec:
  replicas: 2
  selector: {matchLabels: {app: degraded}}
  template:
    metadata: {labels: {app: degraded}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          readinessProbe: {exec: {command: ["false"]}, periodSeconds: 5}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: pdb-degraded, namespace: kdoctor-demo}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: degraded}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: greedy, namespace: kdoctor-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: greedy}}
  template:
    metadata: {labels: {app: greedy}}
    spec:
      containers: [{name: app, image: "busybox:1.36", command: ["sleep", "3600"]}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: pdb-greedy, namespace: kdoctor-demo}
spec:
  minAvailable: 3
  selector: {matchLabels: {app: greedy}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: pdb-orphan, namespace: kdoctor-demo}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: no-existe}}

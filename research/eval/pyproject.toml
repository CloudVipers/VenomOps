[project]
name = "venomops-research-eval"
version = "0.1.0"
description = "Evaluation harness for the VenomOps research line (ADR 0011): injection, detection and redaction experiments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  # Installed from the monorepo in editable mode (see Makefile); no other runtime dependency.
  "venomops-findings-schema",
  "venomops-pr-agent",
  "venomops-arch-committee",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
venom-eval = "venom_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/venom_eval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "E501"]  # dense literal test data

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["hcl2", "hcl2.*", "boto3", "botocore.*", "github", "github.*"]
ignore_missing_imports = true

name: CI pr-agent

on:
  pull_request:
    paths:
      - "packages/pr-agent/**"
      - "packages/findings-schema/**"   # pr-agent depende del contrato (se instala en modo editable)
      - "examples/benchmark/secrets/**"   # corpus compartido de secretos (E4)
      - "examples/terraform/**"
      - "examples/findings/**"
      - ".github/workflows/ci-pr-agent.yml"
  push:
    branches: [main]
    paths:
      - "packages/pr-agent/**"
      - "packages/findings-schema/**"
      - "examples/benchmark/secrets/**"   # corpus compartido de secretos (E4)
      - "examples/terraform/**"
      - "examples/findings/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/pr-agent

jobs:
  pr-agent:
    name: ruff + mypy + pytest (terraform real)
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      # Reutiliza el provider de AWS entre ejecuciones (es pesado de descargar).
      - name: Create Terraform plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
        working-directory: .

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: tf-plugins-${{ hashFiles('examples/terraform/*/versions.tf') }}

      - name: Install (findings-schema first, then pr-agent)
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e ../findings-schema/python -e ".[dev]"

      - name: Lint (ruff, ruff format, mypy --strict)
        run: make lint

      - name: Test (includes real terraform init/validate/plan in a sandbox)
        run: make test

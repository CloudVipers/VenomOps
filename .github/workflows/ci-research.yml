name: CI research-eval

on:
  pull_request:
    paths:
      - "research/eval/**"
      - "packages/pr-agent/**"        # el arnés ejecuta pr-agent real (E1)
      - "packages/arch-committee/**"  # y el comité real con un LLM simulado (E2)
      - "packages/findings-schema/**"
      - "examples/benchmark/**"
      - "examples/terraform/**"
      - "examples/plans/**"
      - "examples/findings/**"
      - ".github/workflows/ci-research.yml"
  push:
    branches: [main]
    paths:
      - "research/eval/**"
      - "packages/pr-agent/**"
      - "packages/arch-committee/**"
      - "packages/findings-schema/**"
      - "examples/benchmark/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: research/eval

jobs:
  research-eval:
    name: ruff + mypy + pytest (sin llamadas a Bedrock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install (findings-schema, pr-agent, arch-committee, then the harness)
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e ../../packages/findings-schema/python -e ../../packages/pr-agent \
            -e ../../packages/arch-committee -e ".[dev]"

      - name: Lint (ruff, ruff format, mypy --strict)
        run: make lint

      - name: Test (deterministic; no model calls)
        run: make test

      - name: E4 baseline (deterministic)
        run: make e4

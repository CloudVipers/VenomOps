name: Release venom packages

# Builds the .rpm and .deb for x86_64 and arm64, installs them in clean containers to prove they work, and uploads them as
# workflow artifacts. Manual only. It never touches a release: releases are published by packaging/release/publish-release.sh
# (it used to attach packages when a venom-v* tag was pushed, but creating a release creates that tag, so the workflow
# overwrote the packages the script had just uploaded and left the release's checksums.txt wrong).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/venom-doctor/go.mod
          cache-dependency-path: packages/venom-doctor/go.sum

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build packages
        run: |
          gopath=$(go env GOPATH)
          export PATH="$PATH:$gopath/bin"
          ./packaging/build.sh

      # The same check done by hand on six distributions: install with the real package manager in a clean container.
      - name: Install the rpm in clean containers (RHEL family)
        run: |
          for image in rockylinux:9 amazonlinux:2023; do
            echo "== $image"
            docker run --rm -v "$PWD/packaging/dist":/pk:ro "$image" bash -c \
              'dnf install -y -q /pk/*.rpm >/dev/null && venom --version && kubectl-venom_doctor --version'
          done

      - name: Install the deb in clean containers (Debian family)
        run: |
          for image in debian:12 ubuntu:24.04; do
            echo "== $image"
            docker run --rm -v "$PWD/packaging/dist":/pk:ro "$image" bash -c \
              'apt-get update -qq >/dev/null && apt-get install -y -qq /pk/*.deb >/dev/null && venom --version && kubectl-venom_doctor --version'
          done

      - name: Checksums
        run: cd packaging/dist && sha256sum ./*.rpm ./*.deb > checksums-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: venom-packages-${{ matrix.arch }}
          path: packaging/dist/*
          retention-days: 7


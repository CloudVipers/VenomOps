name: Publish package repository

# Regenerates the signed yum/dnf and apt repository from the packages of a venom release and publishes it to GitHub Pages
# (https://<org>.github.io/<repo>/). Manual only.
#  - publish=false (default): DRY RUN. Builds the repository with a THROWAWAY key and runs the end-to-end install test; nothing
#    is published and no secret is needed. Use it to check the wiring after changing the packaging.
#  - publish=true: signs with the real key (secrets GPG_SIGNING_KEY and GPG_PASSPHRASE) and deploys to Pages.
# One-time setup (a person with admin rights): Settings > Pages > Source = "GitHub Actions", and the two secrets. See
# packaging/repo/README.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "venom release to take the packages from (for example venom-v0.1.3)"
        required: true
      publish:
        description: "Sign with the real key and publish to Pages (false = dry run with a throwaway key)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the packages of the release
        run: |
          [[ "$TAG" == venom-v* ]] || { echo "tag must look like venom-vX.Y.Z"; exit 1; }
          mkdir -p packages
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.rpm' --pattern '*.deb' --dir packages
          ls -l packages
          VERSION="${TAG#venom-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Always: proves the generator and the install flow on this runner, with a key that exists only for this run.
      - name: Dry run (throwaway key, real dnf and apt installs, tamper checks)
        run: PKG_DIR="$PWD/packages" ./packaging/repo/test-repo.sh

      - name: Build the signed site with the real key
        if: ${{ inputs.publish }}
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          [ -n "$GPG_SIGNING_KEY" ] || { echo "secret GPG_SIGNING_KEY is not set"; exit 1; }
          umask 077
          keyfile=$(mktemp)
          printf '%s\n' "$GPG_SIGNING_KEY" > "$keyfile"
          GPG_KEY_FILE="$keyfile" ./packaging/repo/build-repo.sh packages site
          rm -f "$keyfile"
          URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          export URL VERSION
          # shellcheck disable=SC2016  # envsubst takes the literal variable list
          envsubst '${URL} ${VERSION}' < packaging/repo/index.html.tpl > site/index.html
          touch site/.nojekyll
          echo "SITE_URL=$URL" >> "$GITHUB_ENV"

      - uses: actions/configure-pages@v5
        if: ${{ inputs.publish }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.publish }}
        with:
          path: site

  deploy:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI venom-doctor

on:
  pull_request:
    paths:
      - "packages/venom-doctor/**"
      - "packages/findings-schema/**"   # venom-doctor depende del contrato (replace ../findings-schema)
      - ".github/workflows/ci-venom-doctor.yml"
  push:
    branches: [main]
    paths:
      - "packages/venom-doctor/**"
      - "packages/findings-schema/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/venom-doctor

jobs:
  venom-doctor:
    name: lint + test + snapshot build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/venom-doctor/go.mod
          cache-dependency-path: packages/venom-doctor/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: packages/venom-doctor

      - name: Test (race + cover)
        run: go test -race -cover ./...

      # Valida la config de GoReleaser compilando solo la plataforma del runner (compilar las 5
      # plataformas en frío tardaba ~15 min). El snapshot completo se prueba con `make snapshot`.
      - name: GoReleaser (snapshot, single target)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean --single-target --config .goreleaser.yaml
          workdir: packages/venom-doctor

[project]
name = "venomops-findings-schema"
version = "1.0.0"
description = "Tipos pydantic y validador del contrato común de findings de VenomOps"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.6,<3",
  "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["findings_schema"]

# The schema is the single source of truth and lives outside the package; ship a copy inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"../schema/finding.schema.json" = "findings_schema/finding.schema.json"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

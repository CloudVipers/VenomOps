# GoReleaser v2. Ejecutar desde packages/kdoctor:  goreleaser build --snapshot --clean
version: 2

project_name: kdoctor

before:
  hooks:
    # La licencia vive en la raíz del monorepo; se copia aquí (ignorada por git) para empaquetarla.
    - cp ../../LICENSE LICENSE

builds:
  - id: kubectl-doctor
    main: ./cmd/kubectl-doctor
    binary: kubectl-doctor
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: kdoctor
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "kdoctor_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # krew exige el binario y la licencia en la raíz del archivo.
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  disable: true   # la publicación se hará a propósito, más adelante
